<svg width="700" viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'Helvetica Neue', sans-serif; background: transparent;">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1612; text-anchor: middle; }
    .panel-title { font-size: 11px; font-weight: 600; fill: #444441; text-anchor: middle; }
    .bar-label { font-size: 10px; fill: #6b7280; text-anchor: middle; }
    .bar-value { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .annot { font-size: 11px; font-weight: 600; fill: #085041; text-anchor: middle; }
    .legend { font-size: 10px; fill: #6b7280; }
    .caption { font-size: 10px; fill: #6b7280; text-anchor: middle; font-style: italic; }
    .stat-label { font-size: 10px; fill: #6b7280; text-anchor: middle; }
    .stat-value { font-size: 16px; font-weight: 600; fill: #085041; text-anchor: middle; }
  </style>

  <text class="title" x="350" y="24">Production economics — before and after Collaborator Newsroom</text>

  <!-- Legend -->
  <rect x="230" y="38" width="10" height="10" rx="2" fill="#B4B2A9"/>
  <text class="legend" x="246" y="47">Before</text>
  <rect x="310" y="38" width="10" height="10" rx="2" fill="#1D9E75"/>
  <text class="legend" x="326" y="47">After deployment</text>

  <!-- Panel 1: Story production time -->
  <text class="panel-title" x="120" y="78">Story production time</text>
  <!-- Before bar: 45 min, full height = 200px for 45 -->
  <rect x="72" y="92" width="40" height="180" rx="3" fill="#B4B2A9"/>
  <text class="bar-value" x="92" y="88" fill="#5F5E5A">45 min</text>
  <!-- After bar: 5 min -->
  <rect x="128" y="252" width="40" height="20" rx="3" fill="#1D9E75"/>
  <text class="bar-value" x="148" y="248" fill="#085041">5 min</text>
  <!-- Annotation -->
  <text class="annot" x="120" y="290">9× faster</text>
  <!-- Baseline -->
  <line x1="62" y1="272" x2="178" y2="272" stroke="#c8bfb0" stroke-width="0.5"/>

  <!-- Panel 2: Journalist adoption -->
  <text class="panel-title" x="310" y="78">Daily journalist adoption</text>
  <!-- Before bar: 0% -->
  <rect x="262" y="270" width="40" height="2" rx="1" fill="#B4B2A9"/>
  <text class="bar-value" x="282" y="264" fill="#5F5E5A">0%</text>
  <!-- After bar: 80% -->
  <rect x="318" y="128" width="40" height="144" rx="3" fill="#1D9E75"/>
  <text class="bar-value" x="338" y="122" fill="#085041">80%</text>
  <!-- Annotation -->
  <text class="annot" x="310" y="290">8 of 10 journalists</text>
  <!-- Baseline -->
  <line x1="252" y1="272" x2="368" y2="272" stroke="#c8bfb0" stroke-width="0.5"/>

  <!-- Panel 3: Capacity unlocked -->
  <text class="panel-title" x="500" y="78">Capacity unlocked</text>
  <!-- Range bar: 2-6 FTEs -->
  <rect x="458" y="132" width="40" height="40" rx="3" fill="#1D9E75" opacity="0.4"/>
  <rect x="458" y="172" width="40" height="80" rx="3" fill="#1D9E75"/>
  <text class="bar-value" x="478" y="126" fill="#085041">6 FTEs</text>
  <text class="bar-value" x="478" y="264" fill="#085041">2 FTEs</text>
  <!-- Range bracket -->
  <line x1="508" y1="136" x2="518" y2="136" stroke="#1D9E75" stroke-width="1"/>
  <line x1="518" y1="136" x2="518" y2="252" stroke="#1D9E75" stroke-width="1"/>
  <line x1="508" y1="252" x2="518" y2="252" stroke="#1D9E75" stroke-width="1"/>
  <text class="annot" x="540" y="194" text-anchor="start">range</text>
  <!-- Baseline -->
  <line x1="448" y1="272" x2="568" y2="272" stroke="#c8bfb0" stroke-width="0.5"/>

  <!-- Bottom stat: Renewal -->
  <rect x="240" y="298" width="220" height="30" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="stat-label" x="295" y="317">Renewal rate:</text>
  <text class="stat-value" x="390" y="318">100%</text>

  <text class="caption" x="350" y="340">Trust → adoption, not adoption → trust. The architecture produces trust; trust produces adoption.</text>
</svg>
