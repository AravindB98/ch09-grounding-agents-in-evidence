<svg width="700" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'Helvetica Neue', sans-serif; background: transparent;">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1612; text-anchor: middle; }
    .panel-title { font-size: 12px; font-weight: 600; text-anchor: middle; }
    .label { font-size: 10px; fill: #6b7280; text-anchor: middle; }
    .label-left { font-size: 10px; fill: #6b7280; text-anchor: start; }
    .eq { font-size: 10px; fill: #444441; text-anchor: middle; font-family: 'Courier New', monospace; }
    .caption { font-size: 10px; fill: #6b7280; text-anchor: middle; font-style: italic; }
    .arrow { stroke-width: 1.5; marker-end: url(#ah1); }
    .dashed { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <text class="title" x="350" y="24">Knowledge architecture — standard LLM vs. RAG-grounded inference</text>

  <!-- Divider -->
  <line x1="350" y1="40" x2="350" y2="310" stroke="#1a1a2e" stroke-width="2" opacity="0.3"/>
  <text x="350" y="328" text-anchor="middle" font-size="10" fill="#1a1a2e" font-weight="600">Epistemic wall: reference object absent vs. present</text>

  <!-- LEFT PANEL: Standard LLM -->
  <text class="panel-title" x="175" y="52" fill="#791F1F">Standard LLM inference</text>

  <!-- Prompt -->
  <rect x="110" y="68" width="130" height="32" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="label" x="175" y="88">Prompt</text>

  <!-- Arrow down -->
  <line x1="175" y1="100" x2="175" y2="125" class="arrow" stroke="#888780"/>

  <!-- Weight matrix -->
  <rect x="95" y="128" width="160" height="50" rx="6" fill="#888780"/>
  <text x="175" y="150" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">W (training data)</text>
  <text x="175" y="166" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">Billions of parameters</text>

  <!-- Arrow down -->
  <line x1="175" y1="178" x2="175" y2="203" class="arrow" stroke="#888780"/>

  <!-- Output -->
  <rect x="110" y="206" width="130" height="32" rx="6" fill="#FAECE7" stroke="#C4583F" stroke-width="0.5"/>
  <text class="label" x="175" y="226" fill="#993C1D">Output</text>

  <!-- Broken provenance line -->
  <line x1="175" y1="238" x2="175" y2="272" stroke="#C4583F" stroke-width="1" class="dashed"/>
  <text x="175" y="286" text-anchor="middle" font-size="16" fill="#C4583F">?</text>

  <text class="eq" x="175" y="310">Provenance: unmeasurable</text>

  <!-- RIGHT PANEL: RAG -->
  <text class="panel-title" x="525" y="52" fill="#085041">RAG-grounded inference</text>

  <!-- Prompt -->
  <rect x="380" y="68" width="100" height="32" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="label" x="430" y="88">Prompt</text>

  <!-- Source documents -->
  <rect x="510" y="68" width="120" height="32" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="label" x="570" y="88" fill="#0F6E56">Source docs</text>

  <!-- Arrow from prompt to retrieval -->
  <line x1="430" y1="100" x2="430" y2="125" class="arrow" stroke="#888780"/>
  <!-- Arrow from source to retrieval -->
  <line x1="570" y1="100" x2="530" y2="125" class="arrow" stroke="#1D9E75"/>

  <!-- Retrieval + Generator -->
  <rect x="395" y="128" width="160" height="50" rx="6" fill="#1D9E75"/>
  <text x="475" y="148" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">Retrieval + Generator</text>
  <text x="475" y="164" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">Bounded by source context</text>

  <!-- Arrow down -->
  <line x1="475" y1="178" x2="475" y2="203" class="arrow" stroke="#1D9E75"/>

  <!-- Output -->
  <rect x="410" y="206" width="130" height="32" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="label" x="475" y="226" fill="#085041">Output</text>

  <!-- Solid provenance line back to source -->
  <line x1="545" y1="220" x2="610" y2="220" stroke="#1D9E75" stroke-width="1.5"/>
  <line x1="610" y1="220" x2="610" y2="84" stroke="#1D9E75" stroke-width="1.5"/>
  <line x1="610" y1="84" x2="632" y2="84" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#ah1)"/>

  <!-- Adherence score -->
  <rect x="420" y="248" width="110" height="24" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="475" y="264" text-anchor="middle" font-size="9" fill="#085041" font-weight="500">adherence ∈ [0, 1]</text>

  <text class="eq" x="525" y="310">Provenance: measurable</text>

  <text class="caption" x="350" y="360">Left: no reference object — deviation is undetectable. Right: bounded source — deviation is quantifiable.</text>
  <text class="caption" x="350" y="375">The shift is architectural, not model-based. Same generator, different epistemological status.</text>
</svg>
