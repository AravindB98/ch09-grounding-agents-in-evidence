<svg width="700" viewBox="0 0 700 590" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'Helvetica Neue', sans-serif; background: transparent;">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1612; text-anchor: middle; }
    .box-label { font-size: 12px; font-weight: 600; fill: #fff; text-anchor: middle; }
    .box-sub { font-size: 10px; fill: rgba(255,255,255,0.85); text-anchor: middle; }
    .side-label { font-size: 9px; fill: #993C1D; text-anchor: end; font-weight: 500; }
    .diag-label { font-size: 12px; font-weight: 600; fill: #085041; text-anchor: middle; }
    .diag-sub { font-size: 10px; fill: #0F6E56; text-anchor: middle; }
    .caption { font-size: 10px; fill: #6b7280; text-anchor: middle; font-style: italic; }
    .arrow-line { stroke: #8b8680; stroke-width: 1.5; marker-end: url(#arrowF); }
    .leader { stroke: #c8bfb0; stroke-width: 0.5; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b8680" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <text class="title" x="350" y="24">RAG without measurement — structural failure anatomy</text>

  <!-- Stage 1: Gray -->
  <rect x="150" y="44" width="400" height="48" rx="8" fill="#888780"/>
  <text class="box-label" x="350" y="63">Stage 1: RAG deployed</text>
  <text class="box-sub" x="350" y="78">Retrieval correct. Appears grounded.</text>
  <text class="side-label" x="135" y="66">No measurement</text>
  <line class="leader" x1="137" y1="66" x2="148" y2="66"/>

  <line class="arrow-line" x1="350" y1="92" x2="350" y2="112"/>

  <!-- Stage 2: Amber -->
  <rect x="150" y="114" width="400" height="48" rx="8" fill="#BA7517"/>
  <text class="box-label" x="350" y="133">Stage 2: Production at scale</text>
  <text class="box-sub" x="350" y="148">Measurement deferred to "phase two"</text>
  <text class="side-label" x="135" y="138">Phase two never comes</text>
  <line class="leader" x1="137" y1="138" x2="148" y2="138"/>

  <line class="arrow-line" x1="350" y1="162" x2="350" y2="182"/>

  <!-- Stage 3: Coral -->
  <rect x="150" y="184" width="400" height="48" rx="8" fill="#C4583F"/>
  <text class="box-label" x="350" y="203">Stage 3: Silent failure accumulates</text>
  <text class="box-sub" x="350" y="218">~3% deviation rate = 9 errors/day undetected</text>
  <text class="side-label" x="135" y="208">Not caught at gen time</text>
  <line class="leader" x1="137" y1="208" x2="148" y2="208"/>

  <line class="arrow-line" x1="350" y1="232" x2="350" y2="252"/>

  <!-- Stage 4: Red -->
  <rect x="150" y="254" width="400" height="48" rx="8" fill="#A32D2D"/>
  <text class="box-label" x="350" y="273">Stage 4: Published fabrication</text>
  <text class="box-sub" x="350" y="288">Retrieval was correct. Model blamed.</text>
  <text class="side-label" x="135" y="278">Misattribution</text>
  <line class="leader" x1="137" y1="278" x2="148" y2="278"/>

  <line class="arrow-line" x1="350" y1="302" x2="350" y2="322"/>

  <!-- Stage 5: Deep Red -->
  <rect x="150" y="324" width="400" height="48" rx="8" fill="#791F1F"/>
  <text class="box-label" x="350" y="343">Stage 5: Model replaced</text>
  <text class="box-sub" x="350" y="358">Error rate: 3% → 2.1%. Measurement still absent.</text>
  <text class="side-label" x="135" y="348">Deficiency preserved</text>
  <line class="leader" x1="137" y1="348" x2="148" y2="348"/>

  <line class="arrow-line" x1="350" y1="372" x2="350" y2="400"/>

  <!-- Diagnosis: Teal -->
  <rect x="130" y="402" width="440" height="60" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text class="diag-label" x="350" y="425">Root cause diagnosis</text>
  <text class="diag-sub" x="350" y="445">Absent measurement layer — not model capability</text>

  <text class="caption" x="350" y="495">The model was blamed. The architecture was the cause.</text>
  <text class="caption" x="350" y="515">Color ramp gray → amber → coral → red = severity escalation.</text>
  <text class="caption" x="350" y="535">Teal diagnosis interrupts the collapse: the fix is architectural.</text>
</svg>
