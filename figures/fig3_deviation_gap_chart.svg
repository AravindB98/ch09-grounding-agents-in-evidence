<svg width="700" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, Helvetica, sans-serif;">
  <rect width="700" height="400" fill="white"/>

  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1612">Token overlap vs. semantic deviation</text>

  <rect x="140" y="42" width="12" height="12" rx="2" fill="#C4583F"/>
  <text x="158" y="52" font-size="10" fill="#6b7280">Deviation</text>
  <rect x="240" y="42" width="12" height="12" rx="2" fill="#1D9E75"/>
  <text x="258" y="52" font-size="10" fill="#6b7280">Adherence</text>
  <rect x="340" y="46" width="20" height="3" fill="#B8860B"/>
  <text x="366" y="52" font-size="10" fill="#6b7280">Threshold 0.50</text>

  <text x="190" y="112" text-anchor="end" font-size="12" font-weight="500" fill="#1a1612">Token overlap</text>
  <text x="190" y="128" text-anchor="end" font-size="10" fill="#6b7280">(Jaccard)</text>

  <text x="190" y="232" text-anchor="end" font-size="12" font-weight="500" fill="#1a1612">Semantic similarity</text>
  <text x="190" y="248" text-anchor="end" font-size="10" fill="#6b7280">(cosine)</text>

  <line x1="200" y1="290" x2="660" y2="290" stroke="#d0d0d0" stroke-width="0.5"/>
  <text x="200" y="306" font-size="10" fill="#6b7280">0.0</text>
  <text x="315" y="306" font-size="10" fill="#6b7280">0.25</text>
  <text x="430" y="306" font-size="10" fill="#6b7280">0.50</text>
  <text x="545" y="306" font-size="10" fill="#6b7280">0.75</text>
  <text x="653" y="306" font-size="10" fill="#6b7280">1.0</text>

  <line x1="430" y1="65" x2="430" y2="288" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="200" y="92" width="401" height="22" rx="4" fill="#C4583F"/>
  <text x="612" y="107" font-size="11" font-weight="600" fill="#C4583F">0.871</text>

  <rect x="200" y="120" width="59" height="22" rx="4" fill="#1D9E75"/>
  <text x="268" y="135" font-size="11" font-weight="600" fill="#1D9E75">0.129</text>

  <text x="620" y="135" font-size="11" font-weight="700" fill="#085041">FLAGGED</text>

  <rect x="200" y="212" width="87" height="22" rx="4" fill="#C4583F"/>
  <text x="296" y="227" font-size="11" font-weight="600" fill="#C4583F">0.12-0.25</text>

  <rect x="200" y="240" width="345" height="22" rx="4" fill="#1D9E75"/>
  <rect x="545" y="240" width="60" height="22" rx="4" fill="#1D9E75" opacity="0.35"/>
  <text x="575" y="255" font-size="11" font-weight="600" fill="#1D9E75">0.75-0.88</text>

  <text x="620" y="255" font-size="11" font-weight="700" fill="#993C1D">NOT FLAGGED</text>

  <line x1="168" y1="103" x2="168" y2="225" stroke="#B8860B" stroke-width="2"/>
  <line x1="162" y1="103" x2="174" y2="103" stroke="#B8860B" stroke-width="2"/>
  <line x1="162" y1="225" x2="174" y2="225" stroke="#B8860B" stroke-width="2"/>
  <text x="155" y="158" text-anchor="end" font-size="15" font-weight="700" fill="#B8860B">Gap</text>
  <text x="155" y="175" text-anchor="end" font-size="12" font-weight="600" fill="#B8860B">0.62-0.75</text>

  <text x="350" y="328" text-anchor="middle" font-size="10" fill="#888">Semantic range varies by embedding model</text>
  <text x="350" y="346" text-anchor="middle" font-size="10" fill="#888">Gap direction is stable: token overlap flags it, semantic similarity misses it</text>

  <text x="350" y="380" text-anchor="middle" font-size="11" fill="#444" font-weight="500">Same fabricated quote. Different metrics. The gap direction is the lesson.</text>
</svg>
