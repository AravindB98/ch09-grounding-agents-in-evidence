<svg width="700" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'Helvetica Neue', sans-serif; background: transparent;">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1612; text-anchor: middle; }
    .input-label { font-size: 11px; fill: #444441; text-anchor: middle; }
    .diamond-label { font-size: 10px; font-weight: 500; fill: #fff; text-anchor: middle; }
    .term-label { font-size: 11px; font-weight: 600; fill: #fff; text-anchor: middle; }
    .branch { font-size: 9px; fill: #6b7280; font-weight: 500; }
    .note-text { font-size: 9px; fill: #5F5E5A; }
    .caption { font-size: 10px; fill: #6b7280; text-anchor: middle; font-style: italic; }
    .arrow { stroke: #888780; stroke-width: 1.5; marker-end: url(#ah8); }
  </style>
  <defs>
    <marker id="ah8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <text class="title" x="350" y="24">Worst-axis gate — scoring logic decision tree</text>

  <!-- Input box -->
  <rect x="180" y="40" width="340" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="input-label" x="350" y="56">Three-axis scorer returns:</text>
  <text class="input-label" x="350" y="72">quote fidelity, attribution accuracy, semantic fidelity</text>

  <line x1="350" y1="80" x2="350" y2="105" class="arrow"/>

  <!-- Decision 1: Any axis = 1? -->
  <polygon points="350,108 440,148 350,188 260,148" fill="#A32D2D"/>
  <text class="diamond-label" x="350" y="144">Any axis = 1?</text>
  <text class="diamond-label" x="350" y="158" font-size="9">(fabrication)</text>

  <!-- Yes → BLOCK -->
  <line x1="440" y1="148" x2="560" y2="148" class="arrow"/>
  <text class="branch" x="490" y="140">Yes</text>
  <rect x="565" y="132" width="100" height="32" rx="6" fill="#A32D2D"/>
  <text class="term-label" x="615" y="152">BLOCK</text>

  <!-- No → next -->
  <line x1="350" y1="188" x2="350" y2="218" class="arrow"/>
  <text class="branch" x="360" y="206">No</text>

  <!-- Decision 2: Any axis ≤ 2? -->
  <polygon points="350,220 440,260 350,300 260,260" fill="#BA7517"/>
  <text class="diamond-label" x="350" y="256">Any axis ≤ 2?</text>
  <text class="diamond-label" x="350" y="270" font-size="9">(significant deviation)</text>

  <!-- Yes → FLAG for review -->
  <line x1="440" y1="260" x2="560" y2="260" class="arrow"/>
  <text class="branch" x="490" y="252">Yes</text>
  <rect x="565" y="244" width="100" height="32" rx="6" fill="#BA7517"/>
  <text class="term-label" x="615" y="264">FLAG</text>

  <!-- No → next -->
  <line x1="350" y1="300" x2="350" y2="330" class="arrow"/>
  <text class="branch" x="360" y="318">No</text>

  <!-- Decision 3: Any axis = 3? -->
  <polygon points="350,332 440,372 350,412 260,372" fill="#B8860B" opacity="0.7"/>
  <text class="diamond-label" x="350" y="368">Any axis = 3?</text>
  <text class="diamond-label" x="350" y="382" font-size="9">(marginal)</text>

  <!-- Yes → FLAG with fix -->
  <line x1="440" y1="372" x2="560" y2="372" class="arrow"/>
  <text class="branch" x="490" y="364">Yes</text>
  <rect x="565" y="356" width="100" height="32" rx="6" fill="#B8860B" opacity="0.8"/>
  <text class="term-label" x="615" y="376">FLAG + fix</text>

  <!-- No → PASS -->
  <line x1="350" y1="412" x2="350" y2="442" class="arrow"/>
  <text class="branch" x="360" y="430">No</text>

  <!-- PASS terminal -->
  <rect x="300" y="445" width="100" height="32" rx="6" fill="#1D9E75"/>
  <text class="term-label" x="350" y="465">PASS</text>

  <!-- Note box -->
  <rect x="40" y="132" width="200" height="60" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="note-text" x="50" y="148" text-anchor="start">Worst-axis gate, not average:</text>
  <text class="note-text" x="50" y="162" text-anchor="start">one misattribution is a publishable</text>
  <text class="note-text" x="50" y="176" text-anchor="start">error regardless of overall score.</text>

  <text class="caption" x="350" y="500">The scoring logic encodes a theory of what failure means in the deployment domain.</text>
  <text class="caption" x="350" y="515">That theory is the Human Decision Node — it cannot be set by the agent. (§5.4)</text>
</svg>
